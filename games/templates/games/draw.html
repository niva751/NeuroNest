{% extends 'games/base.html' %}
{% load static %}

{% block content %}
<h1>{{ game_name }}</h1>

<p>Draw the following object:</p>
<img id="target" src="{% static 'games/fruit_apple.png' %}" width="150" style="border:1px solid #333; margin-bottom:10px;">

<canvas id="canvas" width="500" height="400" style="border:1px solid #333; margin-top:10px;"></canvas>

<div style="margin-top:10px;">
    <button onclick="clearCanvas()">Clear</button>
    <button onclick="saveDrawing()">Save</button>
</div>

<p id="msg" style="font-weight:bold; margin-top:10px;"></p>

{% endblock %}

{% block scripts %}
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let drawing = false;

// Drawing logic
canvas.addEventListener('mousedown', () => drawing = true);
canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
canvas.addEventListener('mousemove', draw);

function draw(e){
    if(!drawing) return;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
}

// Clear canvas
function clearCanvas(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('msg').innerText = '';
}

// Save drawing (frontend only)
function saveDrawing(){
    const dataURL = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'drawing.png';
    a.click();

    document.getElementById('msg').innerText = "Drawing saved locally!";
}
</script>
{% endblock %}
