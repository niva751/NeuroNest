{% extends 'games/base.html' %}
{% load static %}

{% block content %}
<main>
    <h2>{{ game_name }}</h2>  
    <p>Match the cards before time runs out!</p>

    <div id="timer">Time Left: 30s</div>
    <div id="gameBoard" class="game-board"></div>
    <p id="scoreDisplay">Score: 0</p>

    <form id="scoreForm" method="POST" style="display:none;">
        {% csrf_token %}
        <input type="hidden" name="score" id="scoreInput">
    </form>

    <script>
        const cardsData = ['🍎','🍎','🍌','🍌','🍇','🍇','🍉','🍉'];
        let gameBoard = document.getElementById('gameBoard');
        let scoreDisplay = document.getElementById('scoreDisplay');
        let timerDisplay = document.getElementById('timer');

        let firstCard = null;
        let secondCard = null;
        let score = 0;
        let timeLeft = 30; // seconds
        let gameOver = false;

        // Shuffle cards
        cardsData.sort(() => 0.5 - Math.random());

        // Create card elements
        cardsData.forEach((emoji) => {
            let card = document.createElement('div');
            card.className = 'card';
            card.dataset.emoji = emoji;
            card.innerText = '❓';
            card.addEventListener('click', flipCard);
            gameBoard.appendChild(card);
        });

        // Countdown timer
        const countdown = setInterval(() => {
            if (gameOver) return;
            timeLeft--;
            timerDisplay.innerText = 'Time Left: ' + timeLeft + 's';
            if(timeLeft <= 0){
                clearInterval(countdown);
                gameOver = true;
                alert('Time is up! Your score: ' + score);
                submitScore(score);
            }
        }, 1000);

        function flipCard(e) {
            if (gameOver) return;

            let card = e.target;
            if (card === firstCard || card.innerText !== '❓') return;
            card.innerText = card.dataset.emoji;

            if (!firstCard) {
                firstCard = card;
            } else {
                secondCard = card;
                if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
                    score += 10;
                    firstCard.removeEventListener('click', flipCard);
                    secondCard.removeEventListener('click', flipCard);
                    resetSelection();
                    checkWin();
                } else {
                    setTimeout(() => {
                        firstCard.innerText = '❓';
                        secondCard.innerText = '❓';
                        resetSelection();
                    }, 500);
                }
            }
            scoreDisplay.innerText = 'Score: ' + score;
        }

        function resetSelection() {
            firstCard = null;
            secondCard = null;
        }

        function checkWin() {
            const remaining = Array.from(document.getElementsByClassName('card')).filter(c => c.innerText === '❓');
            if (remaining.length === 0) {
                gameOver = true;
                clearInterval(countdown);
                alert('You won ' + '{{ game_name }}' + '! Score: ' + score);
                submitScore(score);
            }
        }

        function submitScore(finalScore) {
            document.getElementById('scoreInput').value = finalScore;
            document.getElementById('scoreForm').submit();
        }
    </script>

    <style>
        /* Game Board */
        .game-board {
            display: flex;
            flex-wrap: wrap;
            width: 340px;
            margin: 20px auto;
            justify-content: center;
        }

        /* Cards */
        .card {
            width: 80px;
            height: 80px;
            margin: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 2px solid #2e7d32;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s, transform 0.2s;
        }
        .card:hover {
            background-color: #e8f5e9;
            transform: scale(1.05);
        }

        /* Timer */
        #timer {
            font-weight: bold;
            font-size: 1.2rem;
            color: #d32f2f;
            margin: 10px 0;
            text-align: center;
        }

        /* Score Display */
        #scoreDisplay {
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            color: #2e7d32;
        }

        /* Main container styling */
        main {
            text-align: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</main>
{% endblock %}
