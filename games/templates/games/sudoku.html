{% extends 'games/base.html' %}

{% block title %}Sudoku Game{% endblock %}

{% block content %}
<h2>Sudoku Game</h2>
<table border="1">
    {% for row in puzzle %}
    <tr>
        {% for cell in row %}
        <td>
            {% if cell != 0 %}
                {{ cell }}
            {% else %}
                <input type="number" min="1" max="9">
            {% endif %}
        </td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>
{% endblock %}
